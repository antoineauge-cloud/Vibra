<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibra - Mode Hors-Ligne</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0c0c1e;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #9333ea, #db2777);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 10px 25px rgba(147, 51, 234, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(to right, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(to right, #9333ea, #db2777);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .tag {
      display: inline-block;
      margin-top: 16px;
      font-size: 11px;
      color: #a855f7;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📻</div>
    <h1>Mode Hors-Ligne</h1>
    <p>
      Vous êtes actuellement déconnecté d'Internet. L'application Vibra se reconnectera automatiquement dès que votre réseau sera rétabli.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Actualiser la connexion
    </button>
    <div class="tag">Vibra • APK & PWA Officielle</div>
  </div>
</body>
</html>
