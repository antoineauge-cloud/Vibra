    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Intercept and silence Vite HMR WebSocket in iframe preview where HMR is disabled -->
    <script>
      (function() {
        function isHmrError(err) {
          if (!err) return false;
          var msg = '';
          if (typeof err === 'string') {
            msg = err;
          } else if (err instanceof Error || typeof err === 'object') {
            msg = (err.message || '') + ' ' + (err.stack || '') + ' ' + (err.reason || '') + ' ' + String(err);
          }
          return msg.indexOf('WebSocket') !== -1 || 
                 msg.indexOf('closed without opened') !== -1 || 
                 msg.indexOf('[vite]') !== -1 || 
                 msg.indexOf('vite-hmr') !== -1 ||
                 msg.indexOf('@vite/client') !== -1;
        }

        try {
          var _OrigWebSocket = window.WebSocket;
          if (_OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              var urlStr = String(url || '');
              if (
                urlStr.indexOf('ais-dev') !== -1 || 
                urlStr.indexOf('localhost') !== -1 || 
                urlStr.indexOf('/vite-hmr') !== -1 || 
                protocols === 'vite-hmr'
              ) {
                return {
                  readyState: 1,
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: 'vite-hmr',
                  binaryType: 'blob',
                  url: urlStr,
                  send: function() {},
                  close: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
              }
              return new _OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = _OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        var _origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isHmrError(arguments[i])) return;
          }
          _origError.apply(console, arguments);
        };

        var _origWarn = console.warn;
        console.warn = function() {
          for (var j = 0; j < arguments.length; j++) {
            if (isHmrError(arguments[j])) return;
          }
          _origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (isHmrError(event.error) || isHmrError(event.message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isHmrError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isHmrError(msg) || isHmrError(error)) {
            return true;
          }
          return false;
        };
      })();
    </script>
    
    <!-- Official Service Worker Registration for PWA Installation -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function(reg) {
                reg.update();
                console.log('Vibra Official Service Worker registered:', reg.scope);
              })
              .catch(function(err) {
                console.warn('Vibra Service Worker registration notice:', err);
              });
          });
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
